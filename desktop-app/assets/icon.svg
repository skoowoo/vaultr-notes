<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Pixel dot-grid baked into the plate background -->
    <pattern id="px-dot" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#FFD60A"/>
      <rect x="0" y="0" width="1.5" height="1.5" fill="#E8C200"/>
    </pattern>
    <clipPath id="sq-clip">
      <rect x="102" y="102" width="820" height="820" rx="184.5" ry="184.5"/>
    </clipPath>
  </defs>

  <!-- macOS squircle plate — shape and size unchanged -->
  <rect x="102" y="102" width="820" height="820" rx="184.5" ry="184.5" fill="#FFD60A"/>

  <!-- Hard pixel shadow — brutalist, 26px right / 30px down -->
  <g transform="translate(538 542) skewX(-8)">
    <path fill="#0D0D0D" d="M -220 -260 L -80 -260 L 20 240 L -120 240 Z"/>
    <path fill="#0D0D0D" d="M 80 -260 L 220 -260 L 120 240 L -20 240 Z"/>
  </g>

  <!-- V mark — asymmetric, dynamic, pixel-lit -->
  <g transform="translate(512 512) skewX(-8)">

    <!-- LEFT STROKE: pure black -->
    <path fill="#0D0D0D"
          d="M -220 -260 L -80 -260 L 20 240 L -120 240 Z"/>

    <!-- RIGHT STROKE: bright white -->
    <path fill="#ffffff"
          d="M 80 -260 L 220 -260 L 120 240 L -20 240 Z"/>

  </g>
</svg>
