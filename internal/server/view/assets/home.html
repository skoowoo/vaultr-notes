<div class="home-container">
  <!-- Sidebar + note list ─────────────────────────────────────────── -->
  <div class="home-shell">
    <aside class="home-side" id="home-side">
      <div class="home-side-top">
        <button type="button" class="icon-btn-ghost"
                :title="/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? 'Search (⌘K)' : 'Search (Ctrl+K)'"
                @click="window.dispatchEvent(new CustomEvent('open-search'))">
          <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8" /><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.34-4.34" />
          </svg>
        </button>
      </div>

      <button type="button" class="home-side-new-btn" title="New note (Ctrl+N)"
              onclick="window.__vaultrDrawer && void window.__vaultrDrawer.openNewInDrawer('','')">
        <svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14M5 12h14" />
        </svg>
        <span>New Note</span>
      </button>

      <nav class="home-side-nav">

        <button type="button" class="side-nav-item home-side-item" :class="{'is-active': activeKey === 'inbox'}"
                @click="selectSection('inbox', '/home/section?type=inbox')">
          <svg class="side-nav-icon home-side-icon" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
               stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M22 12h-6l-2 3h-4l-2-3H2" />
            <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" />
          </svg>
          <span class="home-side-label">Inbox</span>
          <span class="home-side-count" x-show="unreadCount > 0" x-text="unreadCount"></span>
        </button>

        <div class="home-side-group">
          <button type="button" class="side-nav-item home-side-item home-side-item--parent"
                  :class="{'is-active': activeKey === 'chat'}"
                  @click="selectSection('chat', '/home/section?type=chat')">
            <svg class="side-nav-icon home-side-icon" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                 stroke-linejoin="round" viewBox="0 0 24 24">
              <path d="M12 8V4H8" />
              <rect width="16" height="12" x="4" y="8" rx="2" />
              <path d="M2 14h2" />
              <path d="M20 14h2" />
              <path d="M15 13v2" />
              <path d="M9 13v2" />
            </svg>
            <span class="home-side-label">Agent Bots</span>
            <svg class="home-side-chevron" :class="{'is-open': chatsOpen}" @click.stop="toggleChats()"
                 fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6" />
            </svg>
          </button>
          <div class="home-side-children" id="home-side-chats-body" :class="{'is-open': chatsOpen}" x-cloak>
            <div class="home-side-children-inner">
              <template x-for="m in agentBots" :key="m.id">
                <button type="button" class="side-nav-item home-side-child" :class="{'is-active': activeKey === 'chat:' + m.id}"
                        @click="selectChatAgentBot(m.id)">
                  <span class="avatar avatar--sm avatar--accent home-side-child-avatar" :style="m.color ? 'background:' + m.color + ';color:var(--inverse-ink)' : ''"
                        x-text="agentBotInitials(m.name)"></span>
                  <span class="home-side-child-name" x-text="m.name"></span>
                </button>
              </template>
              <div class="home-side-empty" x-show="agentBots.length === 0">No agent bots yet</div>
            </div>
          </div>
        </div>

        <div class="home-side-sep"></div>

        <div class="home-side-group">
          <button type="button" class="side-nav-item home-side-item home-side-item--parent"
                  :class="{'is-active': activeKey === 'graph:'}"
                  @click="selectGraphIndex('')">
            <svg class="side-nav-icon home-side-icon" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                 stroke-linejoin="round" viewBox="0 0 24 24">
              <circle cx="12" cy="4.5" r="2.5" />
              <path d="m10.2 6.3-3.9 3.9" />
              <circle cx="4.5" cy="12" r="2.5" />
              <path d="M7 12h10" />
              <circle cx="19.5" cy="12" r="2.5" />
              <path d="m13.8 17.7 3.9-3.9" />
              <circle cx="12" cy="19.5" r="2.5" />
            </svg>
            <span class="home-side-label">Graph</span>
            <svg class="home-side-chevron" :class="{'is-open': graphOpen}" @click.stop="toggleGraph()"
                 fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6" />
            </svg>
          </button>
          <div class="home-side-children" id="home-side-graph-body" :class="{'is-open': graphOpen}" x-cloak>
            <div class="home-side-children-inner">
              {{range .IndexNotes}}
              <button type="button" class="side-nav-item home-side-child" :class="{'is-active': activeKey === 'graph:{{.Path}}'}"
                      @click="selectGraphIndex('{{.Path}}')">
                <span class="home-side-child-name">{{label .}}</span>
              </button>
              {{end}}
            </div>
          </div>
        </div>

        <button type="button" class="side-nav-item home-side-item" :class="{'is-active': activeKey === 'knowledge'}"
                @click="selectSection('knowledge', '/home/section?type=knowledge')">
          <svg class="side-nav-icon home-side-icon" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
               stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M12 7v14" />
            <path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z" />
          </svg>
          <span class="home-side-label">Knowledge</span>
        </button>

        <button type="button" class="side-nav-item home-side-item" :class="{'is-active': activeKey === 'memory'}"
                @click="selectSection('memory', '/home/section?type=memory')">
          <svg class="side-nav-icon home-side-icon" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
               stroke-linejoin="round" viewBox="0 0 24 24">
            <ellipse cx="12" cy="5" rx="9" ry="3" />
            <path d="M3 5V19A9 3 0 0 0 21 19V5" />
            <path d="M3 12A9 3 0 0 0 21 12" />
          </svg>
          <span class="home-side-label">Memory</span>
        </button>

        <div class="home-side-sep"></div>

        <button type="button" class="side-nav-item home-side-item" :class="{'is-active': activeKey === 'pinned'}"
                @click="selectSection('pinned', '/home/section?type=pinned')">
          <svg class="side-nav-icon home-side-icon" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
               stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M12 17v5" />
            <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v3.76z" />
          </svg>
          <span class="home-side-label">Pinned</span>
        </button>

        <button type="button" class="side-nav-item home-side-item" :class="{'is-active': activeKey === 'shorts'}"
                @click="selectSection('shorts', '/home/section?type=shorts')">
          <svg class="side-nav-icon home-side-icon" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
               stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M8 2v4" />
            <path d="M16 2v4" />
            <rect width="18" height="18" x="3" y="4" rx="2" />
            <path d="M3 10h18" />
            <path d="M8 14h.01" />
            <path d="M12 14h.01" />
            <path d="M16 14h.01" />
            <path d="M8 18h.01" />
            <path d="M12 18h.01" />
            <path d="M16 18h.01" />
          </svg>
          <span class="home-side-label">Shorts</span>
        </button>

        <button type="button" class="side-nav-item home-side-item" :class="{'is-active': activeKey === 'images'}"
                @click="selectSection('images', '/home/section?type=images')">
          <svg class="side-nav-icon home-side-icon" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
               stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M18 22H4a2 2 0 0 1-2-2V6" />
            <path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18" />
            <circle cx="12" cy="8" r="2" />
            <rect width="16" height="16" x="6" y="2" rx="2" />
          </svg>
          <span class="home-side-label">Images</span>
        </button>

        <div class="home-side-group">
          <button type="button" class="side-nav-item home-side-item home-side-item--parent" @click="toggleFolders()">
            <svg class="side-nav-icon home-side-icon" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                 stroke-linejoin="round" viewBox="0 0 24 24">
              <path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2" />
            </svg>
            <span class="home-side-label">Folders</span>
            <svg class="home-side-chevron" :class="{'is-open': foldersOpen}" fill="none" stroke="currentColor"
                 stroke-width="1.7" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6" />
            </svg>
          </button>
          <div class="home-side-children" id="home-side-folders-body" :class="{'is-open': foldersOpen}" x-cloak>
            <div class="home-side-children-inner">
              {{range .Folders}}
              <button type="button" class="side-nav-item home-side-child" :class="{'is-active': activeKey === 'dir:{{.Dir}}'}"
                      @click="selectFolder('{{.Dir}}', '/home/section?type=folder&path={{encdir .Dir}}')">
                <svg class="home-side-child-icon" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                     stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" />
                </svg>
                <span class="home-side-child-name">{{folderLabel .Dir}}</span>
              </button>
              {{end}}
              {{if not .Folders}}<div class="home-side-empty">No folders</div>{{end}}
            </div>
          </div>
        </div>

      </nav>

      <div class="home-side-bottom">
        <button type="button" class="icon-btn-ghost home-side-bottom-btn" title="Settings"
                @click="$store.settingsModal.open = true; $el.blur()">
          <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
        <button type="button" class="icon-btn-ghost home-side-bottom-btn" :class="{'is-active': drawerOpen}"
                :title="/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? 'Reading drawer (⌘E)' : 'Reading drawer (Ctrl+E)'"
                @click="drawerOpen = !drawerOpen">
          <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 3v18" />
            <path stroke-linecap="round" stroke-linejoin="round" d="m10 15-3-3 3-3" />
          </svg>
        </button>
      </div>
    </aside>

    <main class="home-list-pane" id="home-list-pane">
      {{.SectionHTML}}
    </main>
  </div>
</div>
