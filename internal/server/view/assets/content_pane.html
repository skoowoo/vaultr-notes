  <div class="content-pane"
       :class="{ open: contentPaneOpen || inboxSheetOpen }"
       @close-content-pane.document="contentPaneOpen = false">
    <!-- This pane is shared with the inbox message detail below — only one
         of the two is ever visible (mutual exclusion lives in
         homeCtrl/contentPaneCtrl's contentPaneOpen/inboxSheetOpen watchers, home.js/
         content_pane.js), so both reuse the same .content-pane-panel slide/fade
         choreography (content_pane.css) instead of each animating on its own. -->
    <div class="content-pane-panel" x-show="!inboxSheetOpen">

      <!-- ① Tool bar: maximize | create-mode fields | edit-mode fields -->
      <div class="content-pane-tool-bar">
        <!-- Maximize/restore — unconditional (doesn't depend on create vs
             edit mode below), same spot/icon the old tab bar's own button
             used. -->
        <button type="button" class="icon-btn-ghost content-pane-expand-btn"
                @click.stop="toggleMaximizeEditor(); $el.blur()"
                :title="(splitRatio <= 0.02 ? 'Restore split' : 'Maximize editor') + ' (' + (isMac ? '⌘\\' : 'Ctrl+\\') + ')'">
          <!-- maximize: corners pointing outward -->
          <svg x-show="splitRatio > 0.02" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9V5h4"/><path d="M20 9V5h-4"/>
            <path d="M4 15v4h4"/><path d="M20 15v4h-4"/>
          </svg>
          <!-- restore: corners pointing inward -->
          <svg x-show="splitRatio <= 0.02" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 5v4H5"/><path d="M15 5v4h4"/>
            <path d="M9 19v-4H5"/><path d="M15 19v-4h4"/>
          </svg>
        </button>
        <!-- Create mode: editable path input + source / discard / publish -->
        <div class="content-pane-create-bar" x-show="tabs[activeTab] && !tabs[activeTab].path" style="display:none">
          <div class="content-pane-path-input-wrap">
            <input type="text" id="content-pane-path-input" class="content-pane-path-input"
                   placeholder="filename.md  ·  or  /folder/note.md"
                   spellcheck="false" autocomplete="off"
                   aria-autocomplete="list" aria-controls="content-pane-path-ac">
            <ul class="content-pane-path-ac" id="content-pane-path-ac" role="listbox" aria-expanded="false" hidden></ul>
          </div>
          <div class="seg content-pane-view-seg">
            <button type="button" class="seg-btn content-pane-view-btn content-pane-view-btn-wysiwyg active" title="Live preview">
              <svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
            <button type="button" class="seg-btn content-pane-view-btn content-pane-view-btn-source" title="Raw markdown">
              <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="m18 16 4-4-4-4"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="m6 8-4 4 4 4"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="m14.5 4-5 16"/>
              </svg>
            </button>
          </div>
          <button type="button" class="btn-outline btn--xs" @click.stop="discardNewNote()">Discard</button>
          <button type="button" id="content-pane-publish-btn" class="btn-solid btn--xs">Publish</button>
        </div>
        <!-- Edit mode: path label + save status + note actions -->
        <span id="content-pane-path-text" class="content-pane-path-text"
              x-show="activeTab >= 0 && (!tabs[activeTab] || tabs[activeTab].path)"></span>
        <span id="content-pane-save-status" class="content-pane-save-status"
              x-show="activeTab >= 0 && (!tabs[activeTab] || tabs[activeTab].path)">
          <svg class="ssi-pending" width="8" height="8" viewBox="0 0 8 8" fill="currentColor">
            <circle cx="4" cy="4" r="3.5"/>
          </svg>
          <svg class="ssi-saved" width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 7l4 4 6-6"/>
          </svg>
        </span>
        <div class="content-pane-tool-actions" x-show="activeTab >= 0 && (!tabs[activeTab] || tabs[activeTab].path)">
          <!-- Tabs stay functionally the same (open several notes, switch,
               close) — just a vertical dropdown list instead of a
               horizontal strip. Each row is one open tab/draft. -->
          <div class="content-pane-tabs-wrap" id="content-pane-tabs-wrap"
               x-data="{
                 tabsMenuOpen: false, tabsMenuActiveIndex: -1,
                 toggleTabsMenu() { this.tabsMenuOpen = !this.tabsMenuOpen; this.tabsMenuActiveIndex = this.tabsMenuOpen ? activeTab : -1; },
               }"
               @mousedown.outside="tabsMenuOpen = false"
               @content-pane:close-tabs.document="tabsMenuOpen = false">
            <button type="button" class="icon-btn-ghost content-pane-tabs-btn"
                    @click.stop="toggleTabsMenu()"
                    :class="{ active: tabsMenuOpen }"
                    :title="'Open tabs (' + (isMac ? '⌘T' : 'Ctrl+T') + ')'">
              <!-- lucide "swatch-book" -->
              <svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M11 17a4 4 0 0 1-8 0V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2Z"/>
                <path d="M16.7 13H19a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H7"/>
                <path d="M 7 17h.01"/>
                <path d="m11 8 2.3-2.3a2.4 2.4 0 0 1 3.404.004L18.6 7.6a2.4 2.4 0 0 1 .026 3.434L9.9 19.8"/>
              </svg>
            </button>
            <div class="content-pane-tabs-menu" x-show="tabsMenuOpen" x-cloak
                 x-transition:enter="transition ease-out duration-150"
                 x-transition:enter-start="opacity-0 -translate-y-2 scale-[0.97]"
                 x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                 x-transition:leave="transition ease-in duration-100"
                 x-transition:leave-start="opacity-100 translate-y-0 scale-100"
                 x-transition:leave-end="opacity-0 -translate-y-1 scale-[0.98]">
              <template x-for="(tab, i) in tabs" :key="tab.id">
                <div class="content-pane-tabs-menu-row" :class="{active: activeTab === i, 'kbd-active': tabsMenuActiveIndex === i}"
                     @click.stop="contentPaneSwitchTab(i); tabsMenuOpen = false" :title="tab.title">
                  <span class="content-pane-tabs-menu-title" x-text="tab.title"></span>
                  <span class="content-pane-tab-draft-icon" x-show="!tab.path" title="Draft" aria-hidden="true">
                    <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 20h9"/>
                      <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                    </svg>
                  </span>
                  <button type="button" class="content-pane-tabs-menu-close"
                          x-show="tab.path"
                          @click.stop="contentPaneCloseTab(i)"
                          title="Close tab">
                    <svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" style="width:10px;height:10px">
                      <path stroke-linecap="round" d="M18 6 6 18"/>
                      <path stroke-linecap="round" d="m6 6 12 12"/>
                    </svg>
                  </button>
                </div>
              </template>
              <div class="content-pane-tabs-menu-empty" x-show="tabs.length === 0">No open tabs</div>
            </div>
          </div>
          <div class="content-pane-more-wrap" x-data="{ moreOpen: false }"
               @mousedown.outside="moreOpen = false"
               @content-pane:close-more.document="moreOpen = false">
            <button type="button" class="icon-btn-ghost content-pane-more-btn"
                    @click.stop="moreOpen = !moreOpen"
                    :class="{ active: moreOpen }"
                    title="More actions">
              <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                <circle cx="12" cy="5" r="1.6" fill="currentColor" stroke="none"/>
                <circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/>
                <circle cx="12" cy="19" r="1.6" fill="currentColor" stroke="none"/>
              </svg>
            </button>
            <div class="content-pane-more-menu" x-show="moreOpen" x-cloak
                 x-transition:enter="transition ease-out duration-150"
                 x-transition:enter-start="opacity-0 -translate-y-2 scale-[0.97]"
                 x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                 x-transition:leave="transition ease-in duration-100"
                 x-transition:leave-start="opacity-100 translate-y-0 scale-100"
                 x-transition:leave-end="opacity-0 -translate-y-1 scale-[0.98]">
              <button type="button" class="content-pane-more-item content-pane-find-btn"
                      @click.stop="moreOpen = false; __vaultrEditorOpenFind()"
                      :title="'Find (' + (isMac ? '⌘F' : 'Ctrl+F') + ')'">
                <svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <circle cx="11" cy="11" r="8"/><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.34-4.34"/>
                </svg>
                <span>Find</span>
              </button>
              <button type="button" class="content-pane-more-item content-pane-source-toggle-btn"
                      @click.stop="moreOpen = false; editorMode.toggle()"
                      title="Toggle raw markdown">
                <!-- Each pair (icon+label) names the mode a click will switch TO. -->
                <svg class="dstb-goto-source" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m18 16 4-4-4-4"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="m6 8-4 4 4 4"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="m14.5 4-5 16"/>
                </svg>
                <span class="dstb-goto-source">Raw markdown</span>
                <svg class="dstb-goto-wysiwyg" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <span class="dstb-goto-wysiwyg">Live preview</span>
              </button>
              <button type="button" class="content-pane-more-item frag-pin-btn"
                      :class="{ active: tabs[activeTab] && tabs[activeTab].pinned }"
                      x-show="tabs[activeTab] && tabs[activeTab].path"
                      @click.stop="moreOpen = false; togglePinActiveNote()"
                      :title="tabs[activeTab] && tabs[activeTab].pinned ? 'Unpin note' : 'Pin note'">
                <svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"/>
                </svg>
                <span x-text="tabs[activeTab] && tabs[activeTab].pinned ? 'Unpin' : 'Pin'"></span>
              </button>
              <button type="button" class="content-pane-more-item content-pane-compile-btn"
                      x-show="tabs[activeTab] && tabs[activeTab].canCompile"
                      @click.stop="compileContentPaneNote($event)"
                      title="Compile to knowledge note">
                <svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M15 4V2"/><path d="M15 16v-2"/><path d="M8 9h2"/><path d="M20 9h2"/><path d="M17.8 11.8 19 13"/><path d="M15 9h.01"/><path d="M17.8 6.2 19 5"/><path d="m3 21 9-9"/><path d="M12.2 6.2 11 5"/>
                </svg>
                <span class="content-pane-compile-label">Compile</span>
              </button>
              <button type="button" class="content-pane-more-item content-pane-more-item-danger"
                      @click.stop="moreOpen = false; deleteActiveNote()">
                <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 6h18"/><path stroke-linecap="round" stroke-linejoin="round" d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path stroke-linecap="round" stroke-linejoin="round" d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path stroke-linecap="round" stroke-linejoin="round" d="M10 11v6"/><path stroke-linecap="round" stroke-linejoin="round" d="M14 11v6"/>
                </svg>
                Delete
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- ③ Editor area — single CodeMirror 6 view; editorMode.applyWysiwyg/
           applySource toggle live-preview decorations on/off in place
           (see content_pane.js) rather than swapping between two DOM mounts. -->
      <div id="content-pane-edit-area" tabindex="-1"></div>
    </div>

    <!-- Inbox message detail — read-only, distinct from the note editor
         above but sharing this same pane (see the comment on
         .content-pane). Entirely driven by homeCtrl's inboxSelected/
         inboxSheetOpen (home.js's selectInboxMessage/closeInboxSheet). -->
    <div class="content-pane-panel inbox-detail-panel" x-show="inboxSheetOpen">
      <div class="content-pane-tool-bar">
        <span class="inbox-sheet-title" x-text="inboxSelected ? (inboxSelected.title || inboxSelected.source) : ''"></span>
        <button type="button" class="icon-btn-ghost inbox-sheet-close" @click="closeInboxSheet()" title="Close">
          <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path stroke-linecap="round" d="M18 6 6 18"/><path stroke-linecap="round" d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="inbox-sheet-meta">
        <span x-text="inboxSelected ? inboxSelected.source : ''"></span>
        <span>·</span>
        <span x-text="inboxSelected ? fullTime(inboxSelected.createdAt) : ''"></span>
      </div>
      <div class="inbox-sheet-scroll">
        <div class="prose inbox-sheet-body" x-html="inboxSelected ? renderMarkdown(inboxSelected.body) : ''"></div>
      </div>
    </div>
  </div>
