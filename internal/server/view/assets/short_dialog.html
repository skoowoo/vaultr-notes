
  <div id="short-dialog"
       x-data="shortDialogCtrl()"
       x-show="visible"
       x-cloak
       :class="{ 'is-closing': closing }"
       class="short-overlay"
       role="dialog" aria-modal="true" aria-label="New short note"
       @click="onOverlayClick($event)">
    <div class="short-zen-wrap">
      <div class="short-zen-placeholder" x-show="content.length === 0 && !isSaved" aria-hidden="true">
        <div class="short-ph-main">Write a short note…</div>
        <div class="short-ph-hint" x-text="hint"></div>
      </div>
      <textarea x-ref="textarea" class="short-textarea" :class="{ 'is-saved': isSaved }"
                spellcheck="false" x-model="content"
                @keydown="onKeydown($event)"
                @scroll="fadeTop = $refs.textarea.scrollTop > 8"></textarea>
      <div class="short-save-confirm" :class="{ 'is-visible': showSaveConfirm }" aria-hidden="true">✓ Saved</div>
      <div class="short-fade-top" :class="{ 'is-visible': fadeTop }" aria-hidden="true"></div>
    </div>
  </div>
